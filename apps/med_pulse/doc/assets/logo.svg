<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="medpulse-title medpulse-desc">
  <title id="medpulse-title">MedPulse</title>
  <desc id="medpulse-desc">Hexagonal emblem for MedPulse combining a digital auscultation chestpiece and synchronized live ECG and SpO2 trace.</desc>
  <defs>
    <clipPath id="medpulse-hex">
      <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z"/>
    </clipPath>
    <linearGradient id="medpulse-bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f172b"/>
      <stop offset="0.55" stop-color="#191933"/>
      <stop offset="1" stop-color="#090b14"/>
    </linearGradient>
    <linearGradient id="medpulse-stroke" x1="40" y1="60" x2="160" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6b8b"/>
      <stop offset="0.55" stop-color="#ffb86c"/>
      <stop offset="1" stop-color="#63f5d0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#medpulse-hex)">
    <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z" fill="url(#medpulse-bg)"/>
    <path d="M62 46 V82 C62 104 78 120 100 120 C122 120 138 104 138 82 V46" fill="none" stroke="url(#medpulse-stroke)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="62" cy="46" r="6" fill="#ff6b8b"/>
    <circle cx="138" cy="46" r="6" fill="#63f5d0"/>
    <path d="M100 120 V142 C100 156 112 164 126 164 C140 164 150 154 150 140 V126" fill="none" stroke="#63f5d0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="118" r="14" fill="#13162b" stroke="#63f5d0" stroke-width="4.5"/>
    <circle cx="150" cy="118" r="5" fill="#ff6b8b"/>
    <path d="M40 90 H72 L82 72 L94 108 L106 60 L118 96 L128 90 H148" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z" fill="none" stroke="#ff8fa8" stroke-width="4"/>
  </g>
</svg>
