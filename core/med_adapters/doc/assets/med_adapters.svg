<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="medadapt-title medadapt-desc">
  <title id="medadapt-title">MedAdapters</title>
  <desc id="medadapt-desc">Hexagonal emblem for MedAdapters showing modular clinical ports connecting ONNX inference, biosignal workers, and external media planes.</desc>
  <defs>
    <clipPath id="medadapt-hex">
      <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z"/>
    </clipPath>
    <linearGradient id="medadapt-bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#292452"/>
      <stop offset="0.55" stop-color="#171d38"/>
      <stop offset="1" stop-color="#090c18"/>
    </linearGradient>
    <linearGradient id="medadapt-core" x1="70" y1="70" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd36e"/>
      <stop offset="0.55" stop-color="#8fffe8"/>
      <stop offset="1" stop-color="#9e8cff"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#medadapt-hex)">
    <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z" fill="url(#medadapt-bg)"/>
    <g stroke="#ffd36e" stroke-width="3.5" stroke-linecap="round">
      <path d="M100 52 V74"/>
      <path d="M100 126 V148"/>
      <path d="M52 100 H74"/>
      <path d="M126 100 H148"/>
    </g>
    <rect x="74" y="74" width="52" height="52" rx="12" fill="#131932" stroke="url(#medadapt-core)" stroke-width="4.5"/>
    <circle cx="100" cy="100" r="10" fill="url(#medadapt-core)"/>
    <g fill="#131932" stroke="#b9b0ff" stroke-width="2.6">
      <rect x="82" y="34" width="36" height="20" rx="5"/>
      <rect x="82" y="146" width="36" height="20" rx="5"/>
      <rect x="34" y="82" width="20" height="36" rx="5"/>
      <rect x="146" y="82" width="20" height="36" rx="5"/>
    </g>
    <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z" fill="none" stroke="#c3b8ff" stroke-width="4"/>
  </g>
</svg>
