<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="medrtc-title medrtc-desc">
  <title id="medrtc-title">MedRTC</title>
  <desc id="medrtc-desc">Hexagonal emblem for MedRTC illustrating OTP supervision trees and real-time WebRTC SRTP and SCTP media transport channels.</desc>
  <defs>
    <clipPath id="medrtc-hex">
      <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z"/>
    </clipPath>
    <linearGradient id="medrtc-bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11345c"/>
      <stop offset="0.55" stop-color="#0d1e38"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="medrtc-wave" x1="40" y1="60" x2="160" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#66d9ff"/>
      <stop offset="1" stop-color="#6c8cff"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#medrtc-hex)">
    <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z" fill="url(#medrtc-bg)"/>
    <g fill="none" stroke="url(#medrtc-wave)" stroke-linecap="round">
      <path d="M46 72 C62 56 80 50 100 50 C120 50 138 56 154 72" stroke-width="3.5" opacity="0.55"/>
      <path d="M58 84 C71 72 85 67 100 67 C115 67 129 72 142 84" stroke-width="4" opacity="0.8"/>
    </g>
    <g stroke="#66d9ff" stroke-width="3.5" stroke-linecap="round">
      <path d="M100 94 V116"/>
      <path d="M100 116 L60 144"/>
      <path d="M100 116 V148"/>
      <path d="M100 116 L140 144"/>
    </g>
    <circle cx="100" cy="94" r="14" fill="#0c203b" stroke="#8fe3ff" stroke-width="4"/>
    <circle cx="100" cy="94" r="5" fill="#66d9ff"/>
    <circle cx="60" cy="144" r="10" fill="#0c203b" stroke="#66d9ff" stroke-width="3.2"/>
    <circle cx="100" cy="148" r="10" fill="#0c203b" stroke="#8fe3ff" stroke-width="3.2"/>
    <circle cx="140" cy="144" r="10" fill="#0c203b" stroke="#6c8cff" stroke-width="3.2"/>
    <path d="M100 6 L181 53 L181 147 L100 194 L19 147 L19 53 Z" fill="none" stroke="#7dd8ff" stroke-width="4"/>
  </g>
</svg>
