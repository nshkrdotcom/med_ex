<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" role="img">
  <defs>
    <clipPath id="rtc-hex-outer">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <clipPath id="rtc-hex-inner">
      <polygon points="100,14 174.48,57 174.48,143 100,186 25.52,143 25.52,57" />
    </clipPath>

    <linearGradient id="rtc-bezel-metal" x1="20" y1="12" x2="180" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9FA3AD" />
      <stop offset="22%" stop-color="#3D414B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="78%" stop-color="#513F3F" />
      <stop offset="100%" stop-color="#7290BE" />
    </linearGradient>

    <linearGradient id="rtc-bevel-inner" x1="180" y1="188" x2="20" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93AFCD" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090D16" stop-opacity="1" />
      <stop offset="100%" stop-color="#D6AFB0" stop-opacity="0.65" />
    </linearGradient>

    <radialGradient id="rtc-chassis-bg" cx="50%" cy="46%" r="62%" fx="44%" fy="36%">
      <stop offset="0%" stop-color="#132338" />
      <stop offset="48%" stop-color="#0B1320" />
      <stop offset="85%" stop-color="#060A12" />
      <stop offset="100%" stop-color="#04070D" />
    </radialGradient>

    <radialGradient id="rtc-core-aura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#456B95" stop-opacity="0.34" />
      <stop offset="48%" stop-color="#7487BD" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#C39198" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rtc-cross-fill" x1="46" y1="46" x2="154" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16324A" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#0D1E32" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#181B38" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="rtc-cross-stroke" x1="46" y1="46" x2="154" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93AFCD" stop-opacity="0.58" />
      <stop offset="50%" stop-color="#5173A6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D6AFB0" stop-opacity="0.58" />
    </linearGradient>

    <radialGradient id="rtc-lens-glass" cx="44%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#1A3B63" stop-opacity="0.96" />
      <stop offset="55%" stop-color="#0A1729" stop-opacity="0.97" />
      <stop offset="88%" stop-color="#050B14" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#0E2942" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="rtc-rtp-stream" x1="36" y1="100" x2="164" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6086B0" stop-opacity="0.3" />
      <stop offset="22%" stop-color="#6086B0" stop-opacity="1" />
      <stop offset="50%" stop-color="#F2F6F9" stop-opacity="1" />
      <stop offset="78%" stop-color="#7290BE" stop-opacity="1" />
      <stop offset="100%" stop-color="#D6AFB0" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="rtc-sdp-arc-top" x1="56" y1="68" x2="144" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6086B0" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#8FA0CB" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D6AFB0" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="rtc-sdp-arc-bot" x1="144" y1="132" x2="56" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D5B0AB" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#D1A8AF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7290BE" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="rtc-ring-grad" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6086B0" />
      <stop offset="50%" stop-color="#7487BD" />
      <stop offset="100%" stop-color="#C2908A" />
    </linearGradient>

    <linearGradient id="rtc-shield-fill" x1="86" y1="82" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6086B0" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#7487BD" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#C2908A" stop-opacity="0.36" />
    </linearGradient>

    <linearGradient id="rtc-glass-sheen" x1="16" y1="10" x2="130" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#CED8E9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <pattern id="rtc-osc-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#7290BE" stroke-width="0.45" stroke-opacity="0.11" />
    </pattern>

    <filter id="rtc-bloom" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="rtc-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="rtc-inset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <g clip-path="url(#rtc-hex-outer)">

    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="url(#rtc-bezel-metal)" />
    <polygon points="100,4 183.14,52 174.48,57 100,14" fill="#FFFFFF" fill-opacity="0.16" />
    <polygon points="100,4 16.86,52 25.52,57 100,14" fill="#E9EDF5" fill-opacity="0.24" />
    <polygon points="16.86,52 16.86,148 25.52,143 25.52,57" fill="#7290BE" fill-opacity="0.08" />
    <polygon points="183.14,52 183.14,148 174.48,143 174.48,57" fill="#000000" fill-opacity="0.38" />
    <polygon points="100,196 183.14,148 174.48,143 100,186" fill="#000000" fill-opacity="0.5" />
    <polygon points="100,196 16.86,148 25.52,143 100,186" fill="#000000" fill-opacity="0.28" />


    <g clip-path="url(#rtc-hex-inner)">
      <polygon points="100,14 174.48,57 174.48,143 100,186 25.52,143 25.52,57" fill="url(#rtc-chassis-bg)" />
      <rect x="14" y="14" width="172" height="172" fill="url(#rtc-osc-grid)" />
      <circle cx="100" cy="100" r="78" fill="url(#rtc-core-aura)" />


      <g stroke="#7290BE" stroke-width="0.6" stroke-opacity="0.15">
        <line x1="100" y1="14" x2="100" y2="186" />
        <line x1="25.52" y1="57" x2="174.48" y2="143" />
        <line x1="174.48" y1="57" x2="25.52" y2="143" />
      </g>


      <polygon points="100,24 165.82,62 165.82,138 100,176 34.18,138 34.18,62" fill="none" stroke="#7290BE" stroke-width="0.75" stroke-opacity="0.22" stroke-dasharray="4 3" />


      <path d="M 88,45 L 112,45 L 115,48 L 115,85 L 152,85 L 155,88 L 155,112 L 152,115 L 115,115 L 115,152 L 112,155 L 88,155 L 85,152 L 85,115 L 48,115 L 45,112 L 45,88 L 48,85 L 85,85 L 85,48 Z" fill="url(#rtc-cross-fill)" stroke="url(#rtc-cross-stroke)" stroke-width="1.15" filter="url(#rtc-inset)" />


      <circle cx="100" cy="100" r="58" fill="none" stroke="url(#rtc-ring-grad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="46 14.74" transform="rotate(-30 100 100)" opacity="0.75" />


      <circle cx="100" cy="100" r="49" fill="none" stroke="#93AFCD" stroke-width="3.6" stroke-dasharray="1.15 7.402" transform="rotate(-90 100 100)" opacity="0.36" />
      <circle cx="100" cy="100" r="49" fill="none" stroke="#BFD0E2" stroke-width="6.5" stroke-dasharray="2 74.97" transform="rotate(-90 100 100)" opacity="0.82" />


      <circle cx="100" cy="100" r="40" fill="url(#rtc-lens-glass)" stroke="url(#rtc-ring-grad)" stroke-width="1.5" filter="url(#rtc-inset)" />
      <circle cx="100" cy="100" r="31" fill="none" stroke="#7290BE" stroke-width="0.65" stroke-opacity="0.28" />
      <circle cx="100" cy="100" r="22" fill="none" stroke="#D1A8AF" stroke-width="0.65" stroke-opacity="0.26" />


      <path d="M 54,94 C 66,64 134,64 146,94" fill="none" stroke="url(#rtc-sdp-arc-top)" stroke-width="1.75" stroke-linecap="round" filter="url(#rtc-soft-glow)" />
      <path d="M 146,106 C 134,136 66,136 54,106" fill="none" stroke="url(#rtc-sdp-arc-bot)" stroke-width="1.75" stroke-linecap="round" filter="url(#rtc-soft-glow)" />


      <polyline points="141,92 146,95 147,89" fill="none" stroke="#D6AFB0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="59,108 54,105 53,111" fill="none" stroke="#7290BE" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />


      <g fill="none" stroke-linecap="round" opacity="0.72">
        <path d="M 38,88 A 16,16 0 0,0 38,112" stroke="#6086B0" stroke-width="1.4" />
        <path d="M 33,83 A 23,23 0 0,0 33,117" stroke="#7290BE" stroke-width="1.1" stroke-opacity="0.6" />
        <path d="M 162,88 A 16,16 0 0,1 162,112" stroke="#D6AFB0" stroke-width="1.4" />
        <path d="M 167,83 A 23,23 0 0,1 167,117" stroke="#D5B0AB" stroke-width="1.1" stroke-opacity="0.6" />
      </g>


      <line x1="54" y1="100" x2="146" y2="100" stroke="url(#rtc-rtp-stream)" stroke-width="3" stroke-linecap="round" filter="url(#rtc-bloom)" />
      <line x1="54" y1="100" x2="146" y2="100" stroke="#F5F7FA" stroke-width="1.15" stroke-linecap="round" />


      <g filter="url(#rtc-soft-glow)">
        <rect x="65" y="96.5" width="7" height="7" rx="2" fill="#0B1320" stroke="#6086B0" stroke-width="1.4" />
        <circle cx="68.5" cy="100" r="1.4" fill="#F2F6F9" />

        <rect x="128" y="96.5" width="7" height="7" rx="2" fill="#0B1320" stroke="#D6AFB0" stroke-width="1.4" />
        <circle cx="131.5" cy="100" r="1.4" fill="#FBF7F7" />
      </g>


      <polygon points="100,82 115.59,91 115.59,109 100,118 84.41,109 84.41,91" fill="url(#rtc-shield-fill)" stroke="url(#rtc-ring-grad)" stroke-width="1.5" filter="url(#rtc-soft-glow)" />
      <polygon points="100,88 110.39,94 110.39,106 100,112 89.61,106 89.61,94" fill="none" stroke="#F2F6F9" stroke-width="0.65" stroke-opacity="0.55" />
      <circle cx="100" cy="100" r="3" fill="#FFFFFF" filter="url(#rtc-soft-glow)" />


      <g filter="url(#rtc-soft-glow)">

        <circle cx="50" cy="100" r="5" fill="#0B1320" stroke="#6086B0" stroke-width="1.7" />
        <circle cx="50" cy="100" r="2" fill="#F2F6F9" />


        <circle cx="150" cy="100" r="5" fill="#0B1320" stroke="#D5B0AB" stroke-width="1.7" />
        <circle cx="150" cy="100" r="2" fill="#FBF7F7" />
      </g>


      <g>
        <circle cx="100" cy="24" r="2.4" fill="#93AFCD" />
        <circle cx="165.82" cy="62" r="2.4" fill="#7290BE" />
        <circle cx="165.82" cy="138" r="2.4" fill="#D1A8AF" />
        <circle cx="100" cy="176" r="2.4" fill="#D6AFB0" />
        <circle cx="34.18" cy="138" r="2.4" fill="#7290BE" />
        <circle cx="34.18" cy="62" r="2.4" fill="#93AFCD" />
      </g>


      <path d="M 100,14 L 174.48,57 L 174.48,80 C 132,68 74,78 25.52,118 L 25.52,57 Z" fill="url(#rtc-glass-sheen)" />
    </g>


    <polygon points="100,14 174.48,57 174.48,143 100,186 25.52,143 25.52,57" fill="none" stroke="url(#rtc-bevel-inner)" stroke-width="1.5" />
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="none" stroke="#7290BE" stroke-opacity="0.45" stroke-width="1.8" />
  </g>
</svg>
