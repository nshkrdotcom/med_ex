<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" role="img">
  <defs>
    <clipPath id="opus-hex-outer">
      <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" />
    </clipPath>

    <clipPath id="opus-hex-inner">
      <polygon points="100,14 174.48,57 174.48,143 100,186 25.52,143 25.52,57" />
    </clipPath>

    <linearGradient id="opus-bezel-metal" x1="20" y1="12" x2="180" y2="188" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9FA3AD" />
      <stop offset="22%" stop-color="#3D414B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="78%" stop-color="#513F3F" />
      <stop offset="100%" stop-color="#7290BE" />
    </linearGradient>

    <linearGradient id="opus-bevel-inner" x1="180" y1="188" x2="20" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93AFCD" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#090D16" stop-opacity="1" />
      <stop offset="100%" stop-color="#D6AFB0" stop-opacity="0.65" />
    </linearGradient>

    <radialGradient id="opus-chassis-bg" cx="50%" cy="46%" r="62%" fx="44%" fy="36%">
      <stop offset="0%" stop-color="#132338" />
      <stop offset="48%" stop-color="#0B1320" />
      <stop offset="85%" stop-color="#060A12" />
      <stop offset="100%" stop-color="#04070D" />
    </radialGradient>

    <radialGradient id="opus-core-aura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#C48F8E" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#456B95" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#456B95" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="opus-cross-fill" x1="46" y1="46" x2="154" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16324A" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#0D1E32" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#181B38" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="opus-cross-stroke" x1="46" y1="46" x2="154" y2="154" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93AFCD" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#C39198" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#D6AFB0" stop-opacity="0.55" />
    </linearGradient>

    <radialGradient id="opus-chamber-glass" cx="42%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#1E2B58" stop-opacity="0.96" />
      <stop offset="52%" stop-color="#0B1528" stop-opacity="0.97" />
      <stop offset="88%" stop-color="#050B14" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="opus-pcm-in" x1="26" y1="100" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#456B95" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#6086B0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F2F6F9" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="opus-encoded-out" x1="100" y1="100" x2="174" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBF7F7" stop-opacity="1" />
      <stop offset="45%" stop-color="#D6AFB0" stop-opacity="0.98" />
      <stop offset="82%" stop-color="#C48F8E" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C39198" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="opus-ring-grad" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6086B0" />
      <stop offset="50%" stop-color="#D1A8AF" />
      <stop offset="100%" stop-color="#D5B0AB" />
    </linearGradient>

    <linearGradient id="opus-prism-fill" x1="82" y1="76" x2="118" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6086B0" stop-opacity="0.34" />
      <stop offset="50%" stop-color="#C39198" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#D5B0AB" stop-opacity="0.38" />
    </linearGradient>

    <linearGradient id="opus-glass-sheen" x1="16" y1="10" x2="130" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#CED8E9" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <pattern id="opus-osc-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#7290BE" stroke-width="0.45" stroke-opacity="0.11" />
    </pattern>

    <filter id="opus-bloom" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="opus-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="opus-inset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <g clip-path="url(#opus-hex-outer)">

    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="url(#opus-bezel-metal)" />
    <polygon points="100,4 183.14,52 174.48,57 100,14" fill="#FFFFFF" fill-opacity="0.16" />
    <polygon points="100,4 16.86,52 25.52,57 100,14" fill="#E9EDF5" fill-opacity="0.24" />
    <polygon points="16.86,52 16.86,148 25.52,143 25.52,57" fill="#7290BE" fill-opacity="0.08" />
    <polygon points="183.14,52 183.14,148 174.48,143 174.48,57" fill="#000000" fill-opacity="0.38" />
    <polygon points="100,196 183.14,148 174.48,143 100,186" fill="#000000" fill-opacity="0.5" />
    <polygon points="100,196 16.86,148 25.52,143 100,186" fill="#000000" fill-opacity="0.28" />


    <g clip-path="url(#opus-hex-inner)">
      <polygon points="100,14 174.48,57 174.48,143 100,186 25.52,143 25.52,57" fill="url(#opus-chassis-bg)" />
      <rect x="14" y="14" width="172" height="172" fill="url(#opus-osc-grid)" />
      <circle cx="100" cy="100" r="78" fill="url(#opus-core-aura)" />


      <g stroke="#7290BE" stroke-width="0.6" stroke-opacity="0.15">
        <line x1="100" y1="14" x2="100" y2="186" />
        <line x1="25.52" y1="57" x2="174.48" y2="143" />
        <line x1="174.48" y1="57" x2="25.52" y2="143" />
      </g>


      <polygon points="100,24 165.82,62 165.82,138 100,176 34.18,138 34.18,62" fill="none" stroke="#D1A8AF" stroke-width="0.75" stroke-opacity="0.24" stroke-dasharray="4 3" />


      <path d="M 88,45 L 112,45 L 115,48 L 115,85 L 152,85 L 155,88 L 155,112 L 152,115 L 115,115 L 115,152 L 112,155 L 88,155 L 85,152 L 85,115 L 48,115 L 45,112 L 45,88 L 48,85 L 85,85 L 85,48 Z" fill="url(#opus-cross-fill)" stroke="url(#opus-cross-stroke)" stroke-width="1.15" filter="url(#opus-inset)" />


      <circle cx="100" cy="100" r="58" fill="none" stroke="url(#opus-ring-grad)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="106 15.48" transform="rotate(-142 100 100)" opacity="0.78" />


      <circle cx="100" cy="100" r="50" fill="none" stroke="#93AFCD" stroke-width="4" stroke-dasharray="1.3 14.408" transform="rotate(-90 100 100)" opacity="0.45" />
      <circle cx="100" cy="100" r="50" fill="none" stroke="#D5B0AB" stroke-width="6.5" stroke-dasharray="2 76.54" transform="rotate(-90 100 100)" opacity="0.85" />


      <circle cx="100" cy="100" r="40" fill="url(#opus-chamber-glass)" stroke="url(#opus-ring-grad)" stroke-width="1.5" filter="url(#opus-inset)" />


      <g stroke-linecap="round" opacity="0.45">
        <line x1="76" y1="88" x2="76" y2="112" stroke="#6086B0" stroke-width="1.5" />
        <line x1="81" y1="81" x2="81" y2="119" stroke="#7290BE" stroke-width="1.5" />
        <line x1="86" y1="74" x2="86" y2="126" stroke="#93AFCD" stroke-width="1.5" />
        <line x1="114" y1="79" x2="114" y2="121" stroke="#D6AFB0" stroke-width="1.5" />
        <line x1="119" y1="86" x2="119" y2="114" stroke="#D5B0AB" stroke-width="1.5" />
        <line x1="124" y1="92" x2="124" y2="108" stroke="#D1A8AF" stroke-width="1.5" />
      </g>


      <path d="M 32,74 L 84,88 L 116,92 L 166,94" fill="none" stroke="#7290BE" stroke-width="0.7" stroke-opacity="0.32" stroke-dasharray="2 2" />
      <path d="M 32,126 L 84,112 L 116,108 L 166,106" fill="none" stroke="#D6AFB0" stroke-width="0.7" stroke-opacity="0.32" stroke-dasharray="2 2" />


      <polygon points="100,74 119,100 100,126 81,100" fill="url(#opus-prism-fill)" stroke="url(#opus-ring-grad)" stroke-width="1.4" filter="url(#opus-soft-glow)" />
      <polygon points="100,82 112,100 100,118 88,100" fill="none" stroke="#F2F6F9" stroke-width="0.65" stroke-opacity="0.55" />


      <path d="M 28,100 L 36,100 L 40,84 L 44,118 L 48,76 L 52,124 L 56,82 L 60,116 L 64,72 L 68,128 L 72,85 L 76,114 L 80,91 L 84,100" fill="none" stroke="url(#opus-pcm-in)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#opus-bloom)" />
      <path d="M 28,100 L 36,100 L 40,84 L 44,118 L 48,76 L 52,124 L 56,82 L 60,116 L 64,72 L 68,128 L 72,85 L 76,114 L 80,91 L 84,100" fill="none" stroke="#F2F6F9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />


      <path d="M 116,100 C 122,87 128,87 134,100 C 140,111 146,111 152,100 C 157,92 162,92 167,100 L 172,100" fill="none" stroke="url(#opus-encoded-out)" stroke-width="2.8" stroke-linecap="round" filter="url(#opus-bloom)" />
      <path d="M 116,100 C 122,87 128,87 134,100 C 140,111 146,111 152,100 C 157,92 162,92 167,100 L 172,100" fill="none" stroke="#FBF7F7" stroke-width="1.15" stroke-linecap="round" />


      <g filter="url(#opus-soft-glow)">

        <circle cx="52" cy="100" r="3.4" fill="#0B1320" stroke="#6086B0" stroke-width="1.5" />
        <circle cx="52" cy="100" r="1.4" fill="#F2F6F9" />

        <circle cx="100" cy="100" r="4.2" fill="#0B1320" stroke="#BFD0E2" stroke-width="1.6" />
        <circle cx="100" cy="100" r="1.8" fill="#FFFFFF" />

        <circle cx="148" cy="100" r="3.4" fill="#0B1320" stroke="#D5B0AB" stroke-width="1.5" />
        <circle cx="148" cy="100" r="1.4" fill="#FBF7F7" />
      </g>


      <g>
        <circle cx="100" cy="24" r="2.4" fill="#93AFCD" />
        <circle cx="165.82" cy="62" r="2.4" fill="#7290BE" />
        <circle cx="165.82" cy="138" r="2.4" fill="#D1A8AF" />
        <circle cx="100" cy="176" r="2.4" fill="#D5B0AB" />
        <circle cx="34.18" cy="138" r="2.4" fill="#7290BE" />
        <circle cx="34.18" cy="62" r="2.4" fill="#93AFCD" />
      </g>


      <path d="M 100,14 L 174.48,57 L 174.48,80 C 132,68 74,78 25.52,118 L 25.52,57 Z" fill="url(#opus-glass-sheen)" />
    </g>


    <polygon points="100,14 174.48,57 174.48,143 100,186 25.52,143 25.52,57" fill="none" stroke="url(#opus-bevel-inner)" stroke-width="1.5" />
    <polygon points="100,4 183.14,52 183.14,148 100,196 16.86,148 16.86,52" fill="none" stroke="#7290BE" stroke-opacity="0.45" stroke-width="1.8" />
  </g>
</svg>
